<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Icon Generator</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .container { display: flex; gap: 20px; justify-content: center; align-items: flex-end; margin-bottom: 20px; }
        .icon-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        canvas { border: 1px solid #ddd; }
        button { padding: 10px 20px; background: #48bb78; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #38a169; }
    </style>
</head>
<body>
    <h1>FocusTracker Icon Generator</h1>
    <p>Below are your generated icons. Click "Download All" to save them.</p>

    <div class="container">
        <div class="icon-box">
            <p>128x128</p>
            <canvas id="canvas128" width="128" height="128"></canvas>
        </div>
        <div class="icon-box">
            <p>48x48</p>
            <canvas id="canvas48" width="48" height="48"></canvas>
        </div>
        <div class="icon-box">
            <p>16x16</p>
            <canvas id="canvas16" width="16" height="16"></canvas>
        </div>
    </div>

    <button onclick="downloadAll()">⬇️ Download All Icons</button>

    <script>
        // Design Configuration
        const primaryColor = "#48bb78"; // The Green from your CSS
        const secondaryColor = "#e53e3e"; // The Red
        const darkColor = "#2d3748";

        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const radius = (size / 2) - (size * 0.1); // Padding

            // Clear
            ctx.clearRect(0, 0, size, size);

            // 1. White Background Circle
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.fillStyle = "white";
            ctx.fill();

            // 2. Progress Arc (The "Focus" part - 75% complete)
            ctx.beginPath();
            ctx.arc(center, center, radius * 0.8, -0.5 * Math.PI, 1 * Math.PI);
            ctx.lineWidth = size * 0.25;
            ctx.strokeStyle = primaryColor;
            ctx.stroke();

            // 3. The "Remaining" Arc (Grey/Red)
            ctx.beginPath();
            ctx.arc(center, center, radius * 0.8, 1 * Math.PI, 1.5 * Math.PI);
            ctx.strokeStyle = "#e2e8f0";
            ctx.stroke();
        }

        // Draw all sizes
        drawIcon('canvas128', 128);
        drawIcon('canvas48', 48);
        drawIcon('canvas16', 16);

        function downloadAll() {
            downloadCanvas('canvas128', 'icon128.png');
            downloadCanvas('canvas48', 'icon48.png');
            downloadCanvas('canvas16', 'icon16.png');
            
            // Also download a generic one just named "icon.png" for simplicity
            downloadCanvas('canvas128', 'icon.png');
        }

        function downloadCanvas(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
